apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberwatch
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cyberwatch
  template:
    metadata:
      labels:
        app: cyberwatch
    spec:
      containers:
        - name: cyberwatch
          image: cyberwatch:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
